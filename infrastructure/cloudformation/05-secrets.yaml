AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Secrets Manager
Resources:
  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: g6-projeto/application-secret
      Description: Secret utilizado pela aplicação
      SecretString: |
        {
          "username": "admin",
          "password": "altere-esta-senha",
          "api_key": "altere-esta-chave"
        }

Outputs:
  SecretArn:
    Description: ARN do secret no Secrets Manager
    Value: !Ref ApplicationSecret

  SecretName:
    Description: Nome do secret
    Value: !Ref ApplicationSecret