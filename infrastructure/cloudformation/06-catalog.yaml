
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  AWS Glue Data Catalog e Athena WorkGroup
  utilizando buckets S3 existentes.

Parameters:

  AthenaResultsBucket:
    Type: String
    Description: Bucket S3 para resultados das consultas Athena.

  DataBucketRaw:
    Type: String
    Description: Bucket S3 com os arquivos RAW de telemetria.

  GlueDatabaseName:
    Type: String
    Default: g6_glue_catalog_caio_2026
    Description: Nome exclusivo do Glue Database.

  AthenaWorkGroupName:
    Type: String
    Default: g6-athena-workgroup-caio-2026
    Description: Nome exclusivo do Athena WorkGroup.

Resources:

  GlueDatabase:
    Type: AWS::Glue::Database

    Properties:
      CatalogId: !Ref AWS::AccountId

      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: >
          Database para catalogação de dados RAW
          utilizando AWS Glue Data Catalog e Athena.

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup

    Properties:
      Name: !Ref AthenaWorkGroupName

      Description: >
        WorkGroup Athena integrado ao Glue Data Catalog.

      State: ENABLED

      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub
            - s3://${Bucket}/athena-results/
            - Bucket: !Ref AthenaResultsBucket

        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true

  TbRawIngestions:
    Type: AWS::Glue::Table

    DependsOn:
      - GlueDatabase

    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase

      TableInput:
        Name: tb_raw_ingestions

        Description: >
          Tabela externa de ingestões RAW de telemetria.

        TableType: EXTERNAL_TABLE

        Parameters:
          classification: parquet
          EXTERNAL: "TRUE"
          parquet.compression: SNAPPY

        PartitionKeys:
          - Name: ymd
            Type: int
            Comment: Data de referência no formato YYYYMMDD.

        StorageDescriptor:
          Location: !Sub
            - s3://${Bucket}/data/tb_raw_ingestions/
            - Bucket: !Ref DataBucketRaw

          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat

          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat

          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

          StoredAsSubDirectories: false

          Columns:
            - Name: registrado_em
              Type: string

            - Name: evento
              Type: string

            - Name: topico
              Type: string

            - Name: payload
              Type: struct<metricas:struct<temperatura_arrefecimento:double,rpm_motor:double,temperatura_pressao_pneu:double,temperatura_freio:double>>

Outputs:

  GlueDatabase:
    Description: Nome do Glue Database.
    Value: !Ref GlueDatabase

  GlueCatalogId:
    Description: ID da conta AWS.
    Value: !Ref AWS::AccountId

  AthenaWorkGroup:
    Description: Nome do Athena WorkGroup.
    Value: !Ref AthenaWorkGroup

  AthenaResultsLocation:
    Description: Local dos resultados Athena.
    Value: !Sub s3://${AthenaResultsBucket}/athena-results/

  RawTableLocation:
    Description: Local dos arquivos RAW.
    Value: !Sub s3://${DataBucketRaw}/data/tb_raw_ingestions/