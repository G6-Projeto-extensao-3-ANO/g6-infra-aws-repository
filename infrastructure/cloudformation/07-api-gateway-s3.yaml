AWSTemplateFormatVersion: '2010-09-09'
Description: >
  API Gateway REST integrada ao bucket S3 RAW existente.
  Recebe arquivos JSON por PUT e grava os objetos no bucket informado.

Parameters:
  BucketName:
    Type: String
    Description: Nome do bucket RAW existente, obtido da stack G6-s3.
    MinLength: 3
    MaxLength: 63

  ApiName:
    Type: String
    Default: azure-aws-api
    Description: Nome da API REST.

  StageName:
    Type: String
    Default: hmg
    AllowedPattern: '[A-Za-z0-9_-]+'
    Description: Estagio de implantacao da API.
  
  ApiGatewayRoleArn:
    Type: String
    Default: arn:aws:iam::332644049657:role/LabRole
    Description: ARN da role IAM existente utilizada pelo API Gateway.

Resources:
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref ApiName
      Description: API REST para upload de arquivos JSON no bucket S3 RAW.
      EndpointConfiguration:
        Types:
          - REGIONAL
      BinaryMediaTypes:
        - application/json
      Tags:
        - Key: Ambiente
          Value: Projeto
        - Key: Tipo
          Value: Integracao-Azure-AWS

  FilenameResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: '{filename}'

  UploadPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref FilenameResource
      HttpMethod: PUT
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.filename: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: PUT
        Credentials: !Ref ApiGatewayRoleArn
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${BucketName}/{key}
        PassthroughBehavior: WHEN_NO_MATCH
        RequestParameters:
          integration.request.path.key: method.request.path.filename
        IntegrationResponses:
          - StatusCode: '200'
      MethodResponses:
        - StatusCode: '200'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadPutMethod
    Properties:
      RestApiId: !Ref RestApi
      Description: Deploy da API de upload de arquivos JSON.

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref StageName
      Description: Estagio de homologacao da API.

Outputs:
  BucketName:
    Description: Bucket S3 utilizado pela API.
    Value: !Ref BucketName

  ApiId:
    Description: ID da API REST criada.
    Value: !Ref RestApi

  ApiExecutionRoleArn:
    Description: ARN da IAM Role existente utilizada pelo API Gateway.
    Value: !Ref ApiGatewayRoleArn

  ApiInvokeUrl:
    Description: URL base para upload de arquivos.
    Value: !Sub
      - https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}
      - ApiId: !Ref RestApi
        Stage: !Ref StageName

  ExampleCurl:
    Description: Exemplo de chamada para envio de arquivo JSON.
    Value: !Sub
      - curl -X PUT https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}/dados.json -H Content-Type:application/json -T dados.json
      - ApiId: !Ref RestApi
        Stage: !Ref StageName
